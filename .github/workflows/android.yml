name: android-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-ci:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0：versionCode 取 git 提交数（app/build.gradle.kts 里 rev-list --count HEAD）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (temurin) + gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests + assembleDebug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      # 已知基线：22 Errors / 311 Warnings，先容忍失败只出报告
      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshots/
          if-no-files-found: ignore